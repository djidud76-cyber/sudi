<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4CFF" />
      <stop offset="50%" stop-color="#3800B3" />
      <stop offset="100%" stop-color="#0A0042" />
    </linearGradient>

    <!-- "S" Letter Gradient -->
    <linearGradient id="s-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40E0D0" />
      <stop offset="40%" stop-color="#4169E1" />
      <stop offset="75%" stop-color="#DA70D6" />
      <stop offset="100%" stop-color="#FF1493" />
    </linearGradient>

    <!-- Drop Shadow for the "S" -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg-gradient)" />

  <!-- Stylized "S" -->
  <path 
    d="M 330 150 
       C 280 120, 180 120, 160 200 
       C 140 280, 260 270, 280 320 
       C 300 370, 250 400, 180 370
       L 150 390
       C 220 440, 360 410, 340 320
       C 320 230, 200 240, 180 190
       C 160 140, 270 120, 300 160
       Z" 
    fill="url(#s-gradient)" 
    filter="url(#drop-shadow)" 
    stroke-width="30"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>